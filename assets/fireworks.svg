<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Colorful animated fireworks over a starry night sky">
<defs>
 <radialGradient id="bg"><stop stop-color="#17204a"/><stop offset="1" stop-color="#090c1d"/></radialGradient>
 <g id="burst" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
  <path d="M0,-16 V-45 M0,16 V45 M-16,0 H-45 M16,0 H45 M-11,-11 L-32,-32 M11,11 L32,32 M11,-11 L32,-32 M-11,11 L-32,32"/>
  <circle r="5" fill="currentColor" stroke="none"/>
 </g>
</defs>
<rect width="900" height="260" rx="16" fill="url(#bg)"/>
<g fill="#fff" opacity=".55">
 <circle cx="50" cy="35" r="1"/><circle cx="160" cy="90" r="1.2"/><circle cx="280" cy="18" r="1"/><circle cx="390" cy="63" r="1.5"/><circle cx="530" cy="26" r="1"/><circle cx="650" cy="91" r="1.3"/><circle cx="781" cy="31" r="1"/><circle cx="840" cy="120" r="1"/><circle cx="115" cy="185" r="1"/><circle cx="716" cy="207" r="1"/>
</g>
<g color="#ffcc4d" transform="translate(180 105)"><use href="#burst"><animateTransform attributeName="transform" type="scale" values="0.05;1.1;1.5" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></use></g>
<g color="#ff5fa2" transform="translate(452 75)"><use href="#burst"><animateTransform attributeName="transform" type="scale" values="0.05;1;1.55" dur="3.1s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin=".6s" repeatCount="indefinite"/></use></g>
<g color="#52e2f7" transform="translate(715 123)"><use href="#burst"><animateTransform attributeName="transform" type="scale" values="0.05;1.15;1.55" dur="2.9s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></use></g>
<g color="#ae83ff" transform="translate(325 184)"><use href="#burst"><animateTransform attributeName="transform" type="scale" values="0.05;0.7;1.1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></use></g>
<g color="#5af3a6" transform="translate(600 191)"><use href="#burst"><animateTransform attributeName="transform" type="scale" values="0.05;0.8;1.1" dur="3.3s" begin=".2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="3.3s" begin=".2s" repeatCount="indefinite"/></use></g>
<text x="450" y="241" fill="#c3c8e6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">KEEP LEARNING · KEEP BUILDING</text>
</svg>
